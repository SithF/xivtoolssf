<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFLogs 工具箱</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:#e3e6ec;
    --text:#1c2230;
    --text-muted:#6b7280;
    --primary:#3366ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{max-width:760px;width:100%;}
  .page-header{text-align:center;margin-bottom:32px;}
  .page-header h1{font-size:24px;font-weight:700;margin:0 0 8px;}
  .page-header p{color:var(--text-muted);margin:0;font-size:13.5px;}

  .cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
  .tool-card{
    flex:1;min-width:260px;max-width:340px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px 24px;
    text-decoration:none;
    color:var(--text);
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .tool-card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(20,24,34,.08);
    border-color:var(--primary);
  }
  .tool-card .icon{font-size:30px;line-height:1;}
  .tool-card h2{font-size:17px;margin:0;}
  .tool-card p{font-size:13px;color:var(--text-muted);margin:0;line-height:1.6;}
  .tool-card .go{font-size:12.5px;color:var(--primary);font-weight:600;margin-top:auto;}

  footer{text-align:center;margin-top:32px;font-size:12px;color:var(--text-muted);}
  footer a{color:var(--primary);}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <h1>FFLogs 工具箱</h1>
    <p>基于 FFLogs 战报数据的小工具合集，全部在浏览器本地运行</p>
  </div>
  <div class="cards">
    <a class="tool-card" href="timeline/index.html">
      <div class="icon">🗺️</div>
      <h2>时间轴导出工具</h2>
      <p>解析战报，筛选玩家与技能，导出分析用 CSV 表格或展示用 HTML 时间轴。</p>
      <div class="go">进入工具 →</div>
    </a>
    <a class="tool-card" href="partner/index.html">
      <div class="icon">🤝</div>
      <h2>谁是你的最佳搭档？</h2>
      <p>分析战报数据，看看团里谁跟你最合拍（仅供娱乐参考）。</p>
      <div class="go">进入工具 →</div>
    </a>
  </div>
  <footer>数据均来自 <a href="https://cn.fflogs.com" target="_blank" rel="noopener">FFLogs</a>，凭证与数据处理均在本地浏览器完成</footer>
</div>
</body>
</html>
